  <head>
    <meta charset="UTF-8" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Google Fonts (Tajawal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- ملف التصميم الرئيسي -->
    <link rel="stylesheet" href="style.css" />
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#21211D" />
  </head>
  <body>
    <!-- شريط التنقل العلوي (الناف بار الكامل مثل الصفحة الرئيسية) -->
    <header>
      <nav
        class="navbar navbar-expand-lg fixed-top shadow-sm"
        style="background-color: #21211d; border-bottom: 0.2rem solid #edcea0"
      >
        <div class="container-fluid">
          <a class="navbar-brand ms-lg-3" href="./index.html">
            <img
              src="./5b862b4281f64fd884b11984846f0e97.png"
              width="80"
              alt="إشراق"
            />
          </a>
          <div class="h6 gold text-center d-none d-lg-block my-auto">
            نُشرِقُ برُوحِك.. ونَسْمُو بِقَلْبِك
          </div>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavId"
            aria-controls="collapsibleNavId"
            aria-expanded="false"
            aria-label="Toggle navigation"
            style="border-color: #edcea0"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="collapsibleNavId">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link gold px-3 d-inline-block" href="./index.html"
                  >الرئيسية</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link gold px-3 d-inline-block" href="#"
                  >القرآن الكريم</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link gold px-3 d-inline-block" href="#"
                  >الحديث النبوي</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link gold px-3 d-inline-block" href="#"
                  >الأذكار</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link gold px-3 d-inline-block" href="#"
                  >الأوراد</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link gold px-3 d-inline-block" href="#"

                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <!-- محتوى الصفحة مع إضافة مسافة علوية (margin-top) -->
    <main style="margin-top: 130px" class="pb-5 mb-5">
      <div class="container my-3" style="max-width: 500px">
        <!-- إحصائيات سريعة (عدد الدورات والإجمالي التاريخي) -->
        <div class="row g-2 mb-3 text-center">
          <div class="col-6">
            <div
              class="p-2 bg-card-dark border-gold-subtle rounded-3 shadow-sm"
            >
              <span class="d-block small text-light opacity-75"
                >الدورات المكتملة</span
              >
              <span id="rounds-counter" class="gold fw-bold fs-5">0</span>
            </div>
          </div>
          <div class="col-6">
            <div
              class="p-2 bg-card-dark border-gold-subtle rounded-3 shadow-sm"
            >
              <span class="d-block small text-light opacity-75"
                >إجمالي التسبيحات</span
              >
              <span id="total-counter" class="gold fw-bold fs-5">0</span>
            </div>
          </div>
        </div>

        <!-- صندوق اختيار الذكر -->
        <div
          class="card bg-card-dark border-gold-subtle mb-3 rounded-4 shadow-sm"
        >
          <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label
                for="dhikr-select"
                class="form-label gold fw-bold small m-0"
                >صيغة الذكر الحالي:</label
              >
              <button
                class="btn btn-sm btn-link gold text-decoration-none p-0"
                data-bs-toggle="modal"
                data-bs-target="#addDhikrModal"
              >
                <i class="bi bi-plus-circle me-1"></i>إضافة ذكر مخصص
              </button>
            </div>
            <select
              id="dhikr-select"
              class="form-select bg-dark text-light border-gold-subtle shadow-none"
              onchange="changeDhikr(this)"
            >
              <option value="سُبْحَانَ اللَّهِ">سُبْحَانَ اللَّهِ</option>
              <option value="الْحَمْدُ لِلَّهِ">الْحَمْدُ لِلَّهِ</option>
              <option value="لَا إِلَهَ إِلَّا اللَّهُ">
                لَا إِلَهَ إِلَّا اللَّهُ
              </option>
              <option value="اللَّهُ أَكْبَرُ">اللَّهُ أَكْبَرُ</option>
              <option
                value="سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ"
              >
                سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ
              </option>
            </select>
          </div>
        </div>

        <!-- نص الذكر البارز -->
        <div class="text-center mb-3">
          <div
            id="dhikr-display-text"
            class="gold fs-5 fw-bold px-3 py-1"
            style="min-height: 40px; letter-spacing: 0.5px"
          >
            سُبْحَانَ اللَّهِ
          </div>
        </div>

        <!-- دائرة التسبيح المركزية -->
        <div class="text-center my-3">
          <div
            class="counter-circle-container mx-auto position-relative d-flex justify-content-center align-items-center"
            onclick="incrementCounter()"
            style="cursor: pointer; width: 220px; height: 220px"
          >
            <div
              class="counter-ring rounded-circle d-flex flex-column justify-content-center align-items-center shadow-lg w-100 h-100 border border-3 border-warning"
              style="
                background: radial-gradient(circle, #2a2a24 0%, #1a1a16 100%);
                border-color: #edcea0 !important;
              "
            >
              <span id="counter-number" class="display-3 fw-bold gold m-0"
                >0</span
              >
              <span class="text-light opacity-50 small mt-1">اضغط للتسبيح</span>
            </div>
          </div>
        </div>

        <!-- خرزات المسبحة المرئية (33 خرزة) -->
        <div class="card bg-card-dark border-gold-subtle rounded-4 p-2 my-3">
          <div class="text-center mb-1 small text-light opacity-75">
            دورة السبحة (الهدف: 33)
          </div>
          <div
            class="beads-container d-flex justify-content-center align-items-center flex-wrap gap-1"
            id="beads-wrapper"
            style="max-height: 80px; overflow-y: auto"
          >
            <!-- تتولد الخرزات هنا برمجياً -->
          </div>
        </div>

        <!-- أزرار التحكم (تصفير ومشاركة الأجر) -->
        <div class="d-flex justify-content-center gap-2 mt-3">
          <button
            onclick="resetCounter()"
            class="btn btn-outline-danger btn-sm rounded-pill px-3 py-2"
          >
            <i class="bi bi-arrow-counterclockwise me-1"></i> تصفير الدورة
          </button>
          <button
            onclick="shareProgress()"
            class="btn btn-sm rounded-pill px-3 py-2"
            style="
              background-color: transparent;
              border: 1px solid #edcea0;
              color: #edcea0;
            "
          >
            <i class="bi bi-whatsapp me-1"></i> مشاركة الأجر
          </button>
        </div>
      </div>
    </main>

    <!-- نافذة إضافة ذكر مخصص (Modal) -->
    <div class="modal fade" id="addDhikrModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-card-dark text-light border-gold-subtle">
          <div class="modal-header border-gold-subtle">
            <h5 class="modal-title gold fw-bold fs-6">إضافة صيغة ذكر جديدة</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <input
                type="text"
                id="custom-dhikr-input"
                class="form-control bg-dark text-light border-gold-subtle shadow-none"
                placeholder="اكتب صيغة الذكر هنا..."
              />
            </div>
            <button
              type="button"
              onclick="addNewCustomDhikr()"
              class="btn btn-warning w-100 rounded-pill py-2 text-dark fw-bold"
              style="background-color: #edcea0"
            >
              حفظ وإضافة
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- شريط التنقل السفلي الثابت للهواتف -->
    <nav class="bottom-nav fixed-bottom d-md-none">
      <div
        class="container d-flex justify-content-around align-items-center py-2"
      >
        <!-- زر الرئيسية -->
        <a

          class="nav-item-bottom text-center text-decoration-none"
          data-page="home"
        >
          <i class="bi bi-house-door fs-5 d-block"></i>
          <i class="bi bi-house-door-fill fs-5 d-block active-icon"></i>
          <span class="small">الرئيسية</span>
        </a>

        <!-- زر السبحة -->
        <a
          href="tasbeeh.html"
          class="nav-item-bottom text-center text-decoration-none active"
          data-page="tasbeeh"
        >
          <i class="bi bi-circle fs-5 d-block"></i>
          <i class="bi bi-record-circle-fill fs-5 d-block active-icon"></i>
          <span class="small">السبحة</span>
        </a>

        <!-- زر البوصلة -->
        <a
          href="qibla.html"
          class="nav-item-bottom text-center text-decoration-none"
          data-page="qibla"
        >
          <i class="bi bi-compass fs-5 d-block"></i>
          <i class="bi bi-compass-fill fs-5 d-block active-icon"></i>
          <span class="small">القبلة</span>
        </a>

        <!-- زر المطوف -->
        <!-- زر المطوف (باستخدام أيقونة تعبر عن السعي والحركة) -->
<a
  href="matwaf.html"
  class="nav-item-bottom text-center text-decoration-none"
  data-page="matwaf"
>
  <i class="bi bi-person-walking fs-5 d-block"></i>
  <i class="bi bi-person-walking fs-5 d-block active-icon"></i>
  <span class="small">المطوف</span>
</a>

        <!-- زر الإعدادات -->
        <a
          href="settings.html"
          class="nav-item-bottom text-center text-decoration-none"
          data-page="settings"
        >
          <i class="bi bi-gear fs-5 d-block"></i>
          <i class="bi bi-gear-fill fs-5 d-block active-icon"></i>
          <span class="small">الإعدادات</span>
        </a>
      </div>
    </nav>

    <!-- JavaScript الخاص بالصفحة -->
    <script src="tasbeeh.js"></script>
    <script src="./main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
