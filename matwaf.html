  <style>
    /* تنسيقات خطوات رحلة العمرة الإضافية */
    .step-indicator {
      opacity: 0.4;
      transition: all 0.3s ease;
      color: #fff;
    }
    .step-indicator.active {
      opacity: 1;
      color: #edcea0;
      font-weight: bold;
    }
    .step-indicator.completed {
      opacity: 0.8;
      color: #2ecc71;
    }
    .badge-num {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(33, 33, 29, 0.9);
      border: 1px solid rgba(237, 206, 160, 0.4);
      border-radius: 50%;
      font-size: 0.85rem;
    }
    .step-indicator.active .badge-num {
      background: #edcea0;
      color: #21211D;
      border-color: #edcea0;
      box-shadow: 0 0 10px rgba(237, 206, 160, 0.4);
    }
    .step-line {
      flex-grow: 1;
      height: 1px;
      background: rgba(237, 206, 160, 0.2);
      margin: 0 5px;
    }
    .gold { color: #edcea0 !important; }
    .btn-gold-solid {
      background-color: #edcea0;
      color: #21211D;
      border: none;
    }
    .btn-gold-solid:hover {
      background-color: #d8b88a;
      color: #21211D;
    }
    .supplication-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(237, 206, 160, 0.2);
    }
  </style>

            <!-- حاوية المراحل (تتغير ديناميكياً حسب المرحلة الحالية) -->
            <div id="mutawwif-stage-content">
              <!-- سيتم تعبئتها ديناميكياً عبر الجافاسكريبت -->
            </div>

            <!-- أزرار التنقل العامة بين المراحل -->

              <button onclick="prevStage()" id="btn-prev-stage" class="btn btn-outline-light btn-sm rounded-pill px-3 d-none">
                <i class="bi bi-chevron-right me-1"></i> المرحلة السابقة

  <!-- JavaScript الخاص بالصفحة -->
  <script>
    // تطبيق وضع القراءة الليلية المحفوظ فوراً عند تحميل أي صفحة في الموقع
document.addEventListener('DOMContentLoaded', () => {
    const isNightMode = localStorage.getItem('night_reading_mode') === 'true';
    const toggleSwitch = document.getElementById('nightModeToggle');
    
    if (isNightMode) {
        document.documentElement.setAttribute('data-night-mode', 'true');
        if (toggleSwitch) toggleSwitch.checked = true;
    } else {
        document.documentElement.removeAttribute('data-night-mode');
        if (toggleSwitch) toggleSwitch.checked = false;
    }
});

// دالة التفعيل وإيقاف الوضع الليلي (تُستدعى عند الضغط على الزر في الإعدادات)
function toggleNightReadingMode(checkbox) {
    if (checkbox.checked) {
        document.documentElement.setAttribute('data-night-mode', 'true');
        localStorage.setItem('night_reading_mode', 'true');
    } else {
        document.documentElement.removeAttribute('data-night-mode');
        localStorage.setItem('night_reading_mode', 'false');
    }
}
    // بيانات مراحل العمرة الـ 5
    let currentStage = 1; // 1: الإحرام, 2: الطواف, 3: الركعتان, 4: السعي, 5: الحلق والختام
    let currentLap = 1;   // من 1 لـ 7 للأشواط

    // أدعية الطواف السبعة
    const tawafSupplications = [
      "«رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ» (يبدأ من الحجر الأسود)",
      "«اللهم إِنَّ هَذَا البَيْتَ بَيْتُكَ، وَالحَرَمَ حَرَمُكَ، وَالأَمْنَ أَمْنُكَ، وَهَذَا عَبْدُكَ ابْنُ عَبْدِكَ...»",
      "«اللهم قَنِّعْنِي بِمَا رَزَقْتَني، وَبَارِكْ لِي فِيهِ، وَاخْلُفْ عَلَى كُلِّ غَائِبَةٍ لِي بِخَيْرٍ»",
      "«اللهم اجْعَلْهُ حَجّاً مَبْرُوراً، وَسَعْياً مَشْكُوراً، وَذَنْباً مَغْفُوراً، وَعَمَلاً صَالِحاً مَقْبُولاً»",
      "«اللهم ظِلَّني تَحْتَ ظِلِّ عَرْشِكَ يَوْمَ لا ظِلَّ إِلا ظِلُّكَ، وَلا بَاقِيَ إِلا وَجْهُكَ»",
      "«اللهم اسْقِنِي مِنْ حَوْضِ نَبِيِّكَ مُحَمَّدٍ صلى الله عليه وسلم شَرْبَةً لا أَظْمَأُ بَعْدَهَا أَبَداً»",
      "«اللهم إِنِّي أَعُوذُ بِكَ مِنَ الشَّكِّ وَالشِّرْكِ، وَالشِّقَاقِ وَالنِّفَاقِ، وَسُوءِ الأَخْلَاقِ»"
    ];

    // أدعية السعي السبعة
    const saySupplications = [
      "«إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَائِرِ اللَّهِ... أَبْدَأُ بِمَا بَدَأَ اللَّهُ بِهِ» (الوقوف على الصفا والدعاء)",
      "«لا إله إلا الله وحده لا شريك له، له الملك وله الحمد يحيي ويميت وهو على كل شيء قدير»",
      "«اللهم استعملني بسنة نبيك، وتوفني على ملته، وأعذني من مضلات الفتن»",
      "«رب اغفر وارحم وتجاوز عما تعلم، إنك أنت الأعز الأكرم»",
      "«اللهم إني أسألك موجبات رحمتك وعزائم مغفرتك والسلامة من كل إثم والغنيمة من كل بر»",
      "«اللهم لا تدع لنا ذنباً إلا غفرته، ولا همّاً إلا فرجته، ولا حاجة هي لك رضا إلا قضيتها»",
      "«رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ العَلِيمُ (ختام السعي عند المروة)»"
    ];

    // دالة العرض الرئيسية لتحديث واجهة المراحل
    function renderMutawwifStage() {
      const container = document.getElementById("mutawwif-stage-content");
      const prevBtn = document.getElementById("btn-prev-stage");
      const counterText = document.getElementById("stage-counter-text");
      
      if (!container) return;

      // تحديث أشرطة المؤشرات العلوية
      for (let i = 1; i <= 5; i++) {
        const ind = document.getElementById(`step-ind-${i}`);
        if (ind) {
          ind.className = "step-indicator text-center" + (i === currentStage ? " active" : i < currentStage ? " completed" : "");
        }
      }
      
      if (counterText) counterText.textContent = `المرحلة ${currentStage} من 5`;
      if (prevBtn) prevBtn.classList.toggle("d-none", currentStage === 1);

      let html = "";

      if (currentStage === 1) {
        html = `
          <div class="text-center py-3">
            <h4 class="gold fw-bold mb-3"><i class="bi bi-person-heart me-1"></i> الإحرام والنية من الميقات</h4>
            <p class="text-light opacity-85 px-3 mb-4">
              يُستحب الاغتسال والتطيب للرجال، وتجرد من المخيط، ثم تنوي الإحرام بالعمرة قائلًا بقلبك ولسانك:
            </p>
            <div class="supplication-box p-4 rounded-3 mb-4 text-center">
              <p class="text-gold fs-4 fw-bold mb-0">«لَبِّيكَ اللَّهُمَّ عُمْرَةً»</p>
            </div>
            <p class="text-light small opacity-75 mb-4">ثم تشرع في التلبية المبرورة: <br><span class="text-warning">لبيكَ اللهم لبيك، لبيكَ لا شريك لكَ لبيك <br>إن الحمد والنعمة لك والملك لا شريك لك .</span></p>
            <button onclick="nextStage()" class="btn btn-gold-solid rounded-pill px-5 py-2 fw-bold shadow">
              أتممت الإحرام والتوجه إلى الحرم <i class="bi bi-chevron-left ms-1"></i>
            </button>
          </div>
        `;
      } 
      else if (currentStage === 2) {
        let percent = (currentLap / 7) * 100;
        html = `
          <div class="text-center">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="badge bg-dark border border-gold text-gold">طواف العمرة</span>
              <span class="text-light font-monospace">الشوط ${currentLap} / 7</span>
            </div>
            
            <div class="display-4 fw-bold gold mb-1 font-monospace">${currentLap}</div>
            <div class="progress bg-secondary bg-opacity-25 mx-auto mb-3" style="height: 6px; width: 80%;">
              <div class="progress-bar bg-gold" role="progressbar" style="width: ${percent}%;"></div>
            </div>

            <div class="supplication-box p-4 rounded-3 mb-3 text-center">
              <p class="text-light fs-5 lh-lg mb-0 pt-1">${tawafSupplications[currentLap - 1]}</p>
            </div>

            <div class="d-flex gap-2 justify-content-center">
              <button onclick="prevLap()" class="btn btn-outline-light px-3 py-2 rounded-pill flex-fill">الشوط السابق</button>
              <button onclick="nextStage()" class="btn btn-gold-solid px-4 py-2 rounded-pill flex-fill fw-bold">أتممت هذا الشوط <i class="bi bi-chevron-left ms-1"></i></button>
            </div>
          </div>
        `;
      } 
      else if (currentStage === 3) {
        html = `
          <div class="text-center py-3">
            <h4 class="gold fw-bold mb-3"><i class="bi bi-award me-1"></i> ركعتا سنة الطواف والشرب من زمزم</h4>
            <p class="text-light opacity-85 px-2 mb-3">
              توجه خلف مقام إبراهيم (إن استطعت) وصلّ ركعتين خفيفتين؛ تقرأ في الأولى سورة الكافرون، وفي الثانية سورة الإخلاص.
            </p>
            <div class="p-3 rounded mb-3 bg-dark-subtle border border-gold-subtle text-start">
              <p class="small text-light mb-1"><i class="bi bi-check-circle text-gold me-1"></i> <strong>بعد الصلاة:</strong> توجه إلى ماء زمزم واشرب منها نائلاً بركتها وادع بما شئت.</p>
            </div>
            <button onclick="nextStage()" class="btn btn-gold-solid rounded-pill px-5 py-2 fw-bold shadow mt-2">
              أتممت الصلاة والشرب، إلى السعي <i class="bi bi-chevron-left ms-1"></i>
            </button>
          </div>
        `;
      } 
      else if (currentStage === 4) {
        let percent = (currentLap / 7) * 100;
        let locationName = currentLap % 2 !== 0 ? "البداية من الصفا ➔ باتجاه المروة" : "العودة من المروة ➔ باتجاه الصفا";
        html = `
          <div class="text-center">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="badge bg-dark border border-gold text-gold">سعي العمرة</span>
              <span class="text-light font-monospace small">${locationName} (الشوط ${currentLap}/7)</span>
            </div>
            
            <div class="display-4 fw-bold gold mb-1 font-monospace">${currentLap}</div>
            <div class="progress bg-secondary bg-opacity-25 mx-auto mb-3" style="height: 6px; width: 80%;">
              <div class="progress-bar bg-gold" role="progressbar" style="width: ${percent}%;"></div>
            </div>

            <div class="supplication-box p-4 rounded-3 mb-3 text-center">
              <p class="text-light fs-5 lh-lg mb-0 pt-1">${saySupplications[currentLap - 1]}</p>
            </div>

            <div class="d-flex gap-2 justify-content-center">
              <button onclick="prevLap()" class="btn btn-outline-light px-3 py-2 rounded-pill flex-fill">الشوط السابق</button>
              <button onclick="nextStage()" class="btn btn-gold-solid px-4 py-2 rounded-pill flex-fill fw-bold">أتممت الشوط (التالي) <i class="bi bi-chevron-left ms-1"></i></button>
            </div>
          </div>
        `;
      } 
      else if (currentStage === 5) {
        html = `
          <div class="text-center py-3">
            <h4 class="gold fw-bold mb-3"><i class="bi bi-scissors me-1"></i> الحلق أو التقصير (ختام العمرة)</h4>
            <p class="text-light opacity-85 px-2 mb-4">
              لقد أتممت طوافَك وسعيَك ولله الحمد! الخطوة الأخيرة هي حلق شعر الرأس أو تقصيره (والحلق أفضل للرجال، وللنساء تقصير قدر أنملة).
            </p>
            <div class="p-3 rounded mb-4 bg-success bg-opacity-10 border border-success text-center">
              <p class="text-success fw-bold mb-0">🎉 تقبل الله عمرتك وغفر ذنبك وجعلها مبرورة مشكورة!</p>
            </div>
            <button onclick="resetAllStages()" class="btn btn-outline-light rounded-pill px-4 py-2">
              <i class="bi bi-arrow-counterclockwise me-1"></i> البدء من جديد لعمرة أخرى
            </button>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // التبديل للمرحلة التالية أو الشوط التالي
    function nextStage() {
      if (currentStage === 2 || currentStage === 4) {
        if (currentLap < 7) {
          currentLap++;
          if (navigator.vibrate) navigator.vibrate(30);
          renderMutawwifStage();
          return;
        } else {
          currentLap = 1; // إعادة تعيين العداد عند الانتقال لمرحلة رئيسية جديدة
        }
      }
      
      if (currentStage < 5) {
        currentStage++;
        if (navigator.vibrate) navigator.vibrate(50);
        renderMutawwifStage();
      }
    }

    // الرجوع للمرحلة السابقة
    function prevStage() {
      if (currentStage === 2 && currentLap > 1) {
        currentLap--;
        renderMutawwifStage();
        return;
      }
      if (currentStage === 4 && currentLap > 1) {
        currentLap--;
        renderMutawwifStage();
        return;
      }
      
      if (currentStage > 1) {
        currentStage--;
        if (currentStage === 2 || currentStage === 4) {
          currentLap = 7; 
        }
        renderMutawwifStage();
      }
    }

    // الرجوع للشوط السابق داخل نفس المرحلة
    function prevLap() {
      if (currentLap > 1) {
        currentLap--;
        if (navigator.vibrate) navigator.vibrate(20);
        renderMutawwifStage();
      }
    }

    // إعادة ضبط كامل النسِك
    function resetAllStages() {
      currentStage = 1;
      currentLap = 1;
      renderMutawwifStage();
    }

    // التشغيل الأولي المباشر عند تحميل المستند
    document.addEventListener("DOMContentLoaded", () => {
      renderMutawwifStage();
    });
    
    // تشغيل احتياطي فوري
    renderMutawwifStage();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
