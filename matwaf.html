<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إشراق - المطوف الرقمي</title>
    <!-- Bootstrap 5.3.3 RTL CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Google Fonts (Tajawal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- ملف التصميم الرئيسي -->
    <link rel="stylesheet" href="style.css" />
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#21211D" />
    <style>
      /* تنسيقات خطوات رحلة العمرة الإضافية */
      .step-indicator {
        opacity: 0.4;
        transition: all 0.3s ease;
        color: #fff;
      }
      .step-indicator.active {
        opacity: 1;
        color: #edcea0;
        font-weight: bold;
      }
      .step-indicator.completed {
        opacity: 0.8;
        color: #2ecc71;
      }
      .badge-num {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(33, 33, 29, 0.9);
        border: 1px solid rgba(237, 206, 160, 0.4);
        border-radius: 50%;
        font-size: 0.85rem;
      }
      .step-indicator.active .badge-num {
        background: #edcea0;
        color: #21211d;
        border-color: #edcea0;
        box-shadow: 0 0 10px rgba(237, 206, 160, 0.4);
      }
      .step-line {
        flex-grow: 1;
        height: 1px;
        background: rgba(237, 206, 160, 0.2);
        margin: 0 5px;
      }
      .gold {
        color: #edcea0 !important;
      }
      .btn-gold-solid {
        background-color: #edcea0;
        color: #21211d;
        border: none;
      }
      .btn-gold-solid:hover {
        background-color: #d8b88a;
        color: #21211d;
      }
      .supplication-box {
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(237, 206, 160, 0.2);
      }
    </style>
  </head>
  <body>
    <!-- شريط التنقل العلوي -->

      <nav
        class="navbar navbar-expand-lg fixed-top shadow-sm"

        <div class="container-fluid">
          <a class="navbar-brand ms-lg-3" href="./index.html">
            <img
              src="./5b862b4281f64fd884b11984846f0e97.png"
              width="80"
              alt="إشراق"
            />
          </a>
          <div class="h6 gold text-center d-none d-lg-block my-auto">
            نُشرِقُ برُوحِك.. ونَسْمُو بِقَلْبِك
          </div>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavId"
            aria-controls="collapsibleNavId"

            aria-label="Toggle navigation"
            style="border-color: #edcea0"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="collapsibleNavId">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link gold px-3 d-inline-block" href="./index.html"
                  >الرئيسية</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link gold px-3 d-inline-block" href="#"
                  >القرآن الكريم</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link gold px-3 d-inline-block" href="#"
                  >الحديث النبوي</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link gold px-3 d-inline-block" href="#"

                >
              </li>
              <li class="nav-item">
                <a class="nav-link gold px-3 d-inline-block" href="#"

              </li>
              <li class="nav-item">
                <a class="nav-link gold px-3 d-inline-block" href="#"

              </li>
              <li class="nav-item">
                <a class="nav-link gold px-3 d-inline-block active" href="#"
                  >المطوف</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <!-- محتوى الصفحة مع إضافة مسافة علوية -->
    <main style="margin-top: 130px" class="pb-5 mb-5">
      <div class="container my-3" style="max-width: 600px">
        <!-- قسم المطوف الرقمي - رحلة العمرة المتكاملة (شي أبو راتب) -->
        <div class="row justify-content-center mb-5" id="mutawwif-section">
          <div class="col-12">
            <div
              class="mutawwif-card shadow-lg p-4 rounded-4 position-relative overflow-hidden border border-gold-subtle"
            >
              <!-- شريط المراحل العلوي (Progress Steps) -->
              <div
                class="d-flex justify-content-between align-items-center mb-4 px-2 overflow-x-auto pb-2"
              >
                <div class="step-indicator text-center active" id="step-ind-1">
                  <span class="badge-num">1</span>
                  <small class="d-block mt-1">الإحرام</small>
                </div>
                <div class="step-line"></div>
                <div class="step-indicator text-center" id="step-ind-2">
                  <span class="badge-num">2</span>
                  <small class="d-block mt-1">الطواف</small>
                </div>
                <div class="step-line"></div>
                <div class="step-indicator text-center" id="step-ind-3">
                  <span class="badge-num">3</span>
                  <small class="d-block mt-1">الركعتان</small>
                </div>
                <div class="step-line"></div>
                <div class="step-indicator text-center" id="step-ind-4">
                  <span class="badge-num">4</span>
                  <small class="d-block mt-1">السعي</small>
                </div>
                <div class="step-line"></div>
                <div class="step-indicator text-center" id="step-ind-5">
                  <span class="badge-num">5</span>
                  <small class="d-block mt-1">الختام</small>
                </div>
              </div>

              <!-- حاوية المراحل (تتغير ديناميكياً حسب المرحلة الحالية) -->
              <div id="mutawwif-stage-content">
                <!-- سيتم تعبئتها ديناميكياً عبر الجافاسكريبت -->
              </div>

              <!-- أزرار التنقل العامة بين المراحل -->
              <div
                class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top border-gold-subtle"
              >
                <button
                  onclick="prevStage()"
                  id="btn-prev-stage"
                  class="btn btn-outline-light btn-sm rounded-pill px-3 d-none"
                >
                  <i class="bi bi-chevron-right me-1"></i> المرحلة السابقة
                </button>
                <span
                  id="stage-counter-text"
                  class="small text-muted font-monospace ms-auto"
                  >المرحلة 1 من 5</span
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

        <!-- زر البوصلة -->
        <a

          <i class="bi bi-compass-fill fs-5 d-block active-icon"></i>
          <span class="small">القبلة</span>
        </a>

        <!-- زر المطوف -->
<a
  href="matwaf.html"
  class="nav-item-bottom text-center text-decoration-none active"

>
  <i class="bi bi-person-walking fs-5 d-block"></i>
  <i class="bi bi-person-walking fs-5 d-block active-icon"></i>

</a>

        <!-- زر الإعدادات -->
        <a

          <i class="bi bi-gear fs-5 d-block"></i>

          <span class="small">الإعدادات</span>

      </div>
    </nav>

    <!-- JavaScript الخاص بالصفحة -->
    <script src="./matwaf.js"></script>
    <script src="./main.js"></script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
