            <i class="bi bi-hands-praying me-1"></i> الأدعية

          <a href="./index.html" class="btn btn-sm border-gold" style="border-color: #edcea0; color: #edcea0;">
            <i class="bi bi-arrow-right me-1"></i> الرئيسية
          </a>
        </div>
      </nav>
    </header>

    <!-- دعاء اليوم -->
    <div class="container">
      <div class="supplication-box p-3 rounded-4 mt-3 mb-3" id="daily-dua-box">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <small class="gold fw-bold"><i class="bi bi-sun-fill me-1"></i> دعاء اليوم</small>
          <div class="d-flex gap-1">
            <button class="btn btn-sm btn-outline-light border-0 py-0 px-2" id="daily-dua-copy-btn" title="نسخ"><i class="bi bi-copy"></i></button>
            <button class="btn btn-sm btn-outline-light border-0 py-0 px-2 text-success" id="daily-dua-share-img-btn" title="مشاركة كصورة"><i class="bi bi-image"></i></button>
          </div>
        </div>
        <p class="zikr-text mb-0" id="daily-dua-text" style="font-size: 1.3rem;"></p>
      </div>

      <!-- البحث -->
      <div class="input-group mb-3">
        <span class="input-group-text bg-dark border-gold-subtle" style="color: #edcea0;"><i class="bi bi-search"></i></span>
        <input type="text" id="dua-search-input" class="form-control  text-light border-gold-subtle shadow-none" style="background-color: #21211d;" placeholder="ابحث داخل كل الأدعية...">
      </div>

      <!-- فرز حسب الطول -->
      <div class="d-flex gap-2 mb-3">
        <button class="btn btn-gold-outline btn-sm length-filter-btn active-tab" data-length="all">الكل</button>
        <button class="btn btn-gold-outline btn-sm length-filter-btn" data-length="short">قصيرة</button>
        <button class="btn btn-gold-outline btn-sm length-filter-btn" data-length="long">طويلة</button>
      </div>
    </div>

    <!-- شريط التبويبات -->
    <div class="container">
      <div class="d-flex category-tabs gap-2 mb-3" id="category-tabs"></div>

      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <small class="zikr-progress-note" id="progress-note">0 / 0 تم إنجازها</small>
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-gold-outline btn-sm" title="أدعيتي الشخصية" data-bs-toggle="modal" data-bs-target="#addPersonalDuaModal">
            <i class="bi bi-journal-plus"></i>
          </button>
          <a href="./favorites.html" class="btn btn-gold-outline btn-sm" title="المفضلة">
            <i class="bi bi-star-fill"></i>
          </a>
          <div class="btn-group" role="group" aria-label="حجم الخط">
            <button id="font-decrease-btn" class="btn btn-gold-outline btn-sm" title="تصغير الخط"><i class="bi bi-dash-lg"></i></button>
            <button id="font-increase-btn" class="btn btn-gold-outline btn-sm" title="تكبير الخط"><i class="bi bi-plus-lg"></i></button>
          </div>
          <button id="reset-category-btn" class="btn btn-gold-outline btn-sm" title="إعادة ضبط عدّادات هذه الفئة">
            <i class="bi bi-arrow-counterclockwise"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- محتوى الأذكار -->
    <main style="margin-bottom: 90px">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-lg-9">
            <div id="zikr-container"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- نافذة إضافة دعاء شخصي -->
    <div class="modal fade" id="addPersonalDuaModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark border border-gold-subtle">
          <div class="modal-header border-bottom border-gold-subtle">
            <h5 class="modal-title gold"><i class="bi bi-journal-plus me-1"></i> أدعيتي الشخصية</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <textarea id="personal-dua-input" class="form-control bg-dark text-light border-gold-subtle shadow-none mb-3" rows="3" placeholder="اكتب دعاءك هنا..."></textarea>
            <button type="button" class="btn btn-gold-solid w-100" id="save-personal-dua-btn">حفظ الدعاء</button>
          </div>
        </div>
      </div>
    </div>

    <!-- نافذة مشاركة الدعاء كصورة -->
    <div class="modal fade" id="shareImageModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark border border-gold-subtle">
          <div class="modal-header border-bottom border-gold-subtle">
            <h5 class="modal-title gold"><i class="bi bi-image me-1"></i> مشاركة كصورة</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body text-center">
            <canvas id="dua-share-canvas" width="600" height="600" class="w-100 rounded-3 mb-3" style="max-width: 320px;"></canvas>
            <a id="dua-share-download-link" class="btn btn-gold-solid w-100" download="دعاء-اشراق.png">
              <i class="bi bi-download me-1"></i> حفظ الصورة
            </a>
          </div>
        </div>
      </div>
    </div>
