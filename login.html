<!doctype html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
  <head>
    <title>تسجيل الدخول - إشراق</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS RTL v5.3.3 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Custom Style -->
    <link rel="stylesheet" href="./style.css" />
    <meta name="theme-color" content="#21211D" />

    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 0%, #2a271e, #21211d 60%);
        padding: 1.5rem 0;
      }
      .auth-card {
        width: 100%;
        max-width: 400px;
        background: #262621;
        border: 1px solid rgba(237, 206, 160, 0.25);
        border-radius: 1.5rem;
        padding: 2.25rem 2rem;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .auth-logo {
        width: 72px;
        margin: 0 auto 1rem;
        display: block;
      }
      .auth-tabs {
        display: flex;
        background: #1a1a16;
        border-radius: 999px;
        padding: 4px;
        margin-bottom: 1.5rem;
      }
      .auth-tab-btn {
        flex: 1;
        border: none;
        background: transparent;
        color: #f8f9fa;
        opacity: 0.7;
        padding: 0.5rem;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.25s ease;
      }
      .auth-tab-btn.active {
        background: #edcea0;
        color: #21211d;
        opacity: 1;
      }
      .auth-input {
        background-color: #1a1a16 !important;
        color: #f8f9fa !important;
        border: 1px solid rgba(237, 206, 160, 0.25) !important;
      }
      .auth-input:focus {
        border-color: #edcea0 !important;
        box-shadow: 0 0 0 0.2rem rgba(237, 206, 160, 0.15) !important;
      }
      .auth-submit-btn {
        background: linear-gradient(90deg, #edcea0, #fff6e0, #edcea0);
        background-size: 200% auto;
        color: #21211d;
        font-weight: bold;
        border: none;
        transition: background-position 0.4s ease;
      }
      .auth-submit-btn:hover {
        background-position: right center;
        color: #21211d;
      }
      .auth-error {
        display: none;
        background: rgba(220, 53, 69, 0.12);
        border: 1px solid rgba(220, 53, 69, 0.4);
        color: #ff8f99;
        border-radius: 0.75rem;
        padding: 0.65rem 1rem;
        font-size: 0.85rem;
        margin-bottom: 1rem;
      }
      .auth-spinner {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="auth-card">
      <img
        src="./5b862b4281f64fd884b11984846f0e97.png"
        alt="إشراق"
        class="auth-logo"
      />
      <h4 class="text-center gold fw-bold mb-1">إشراق</h4>
      <p class="text-center text-light opacity-75 small mb-4">
        نُشرِقُ برُوحِك.. ونَسْمُو بِقَلْبِك
      </p>

      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tab-login-btn" onclick="switchAuthTab('login')">
          تسجيل الدخول
        </button>
        <button type="button" class="auth-tab-btn" id="tab-signup-btn" onclick="switchAuthTab('signup')">
          إنشاء حساب
        </button>
      </div>

      <div class="auth-error" id="auth-error-box"></div>

      <!-- نموذج تسجيل الدخول -->
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label small text-light opacity-75">البريد الإلكتروني</label>
          <input type="email" class="form-control auth-input" id="login-email" required />
        </div>
        <div class="mb-4">
          <label class="form-label small text-light opacity-75">كلمة المرور</label>
          <input type="password" class="form-control auth-input" id="login-password" required />
        </div>
        <button type="submit" class="btn auth-submit-btn w-100 rounded-pill py-2">
          <span class="btn-text">تسجيل الدخول</span>
          <span class="spinner-border spinner-border-sm auth-spinner" role="status"></span>
        </button>
      </form>

      <!-- نموذج إنشاء حساب -->
      <form id="signup-form" class="d-none">
        <div class="mb-3">
          <label class="form-label small text-light opacity-75">البريد الإلكتروني</label>
          <input type="email" class="form-control auth-input" id="signup-email" required />
        </div>
        <div class="mb-3">
          <label class="form-label small text-light opacity-75">كلمة المرور</label>
          <input type="password" class="form-control auth-input" id="signup-password" required minlength="6" />
        </div>
        <div class="mb-4">
          <label class="form-label small text-light opacity-75">تأكيد كلمة المرور</label>
          <input type="password" class="form-control auth-input" id="signup-password-confirm" required minlength="6" />
        </div>
        <button type="submit" class="btn auth-submit-btn w-100 rounded-pill py-2">
          <span class="btn-text">إنشاء الحساب</span>
          <span class="spinner-border spinner-border-sm auth-spinner" role="status"></span>
        </button>
      </form>
    </div>

    <!-- Firebase SDK (نسخة compat لعدم وجود أداة تجميع بالمشروع) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="./firebase-config.js"></script>
    <script src="./login.js"></script>
  </body>
</html>
