
<!doctype html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#21211D">

  <title>الإشراق | تسجيل الدخول</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="./style.css">

  <style>
    :root {
      --gold-accent: #EDCEA0;
      --gold-color: #c5a059;
      --desc-text-color: #D3D3C7;
      --ishraq-bg: #21211D;
    }

    * { box-sizing: border-box; }

mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 16px;
      position: relative;
      z-index: 1;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }

    .brand-area {
      text-align: center;
      margin-bottom: 27px;
    }

    .brand-symbol {
      width: 82px;
      height: 82px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(237,206,160,.38);
      border-radius: 50%;
      background: rgba(197,160,89,.07);
      box-shadow: 0 0 35px rgba(197,160,89,.10);
    }

    .brand-symbol img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }

    .brand-name {
      font-family: "Amiri", serif;
      font-size: 3.2rem;
      line-height: 1.15;
      color: var(--gold-accent);
      margin: 0;
    }

    .brand-subtitle {
      color: var(--desc-text-color);
      margin: 8px 0 0;
      font-size: .98rem;
      font-weight: 300;
    }

    .gold-divider {
      width: 100px;
      height: 1px;
      margin: 19px auto 0;
      background: linear-gradient(90deg, transparent, var(--gold-color), transparent);
    }

    .login-card {
      padding: 30px 26px 27px;
      border: 1px solid rgba(237,206,160,.17);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(54,51,43,.88), rgba(27,27,23,.94));
      box-shadow: 0 24px 65px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }

    .card-heading {
      text-align: center;
      margin-bottom: 25px;
    }

    .card-heading h1 {
      font-size: 1.3rem;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .card-heading p {
      color: #aaa99f;
      font-size: .88rem;
      margin: 0;
    }

    .form-label {
      color: #dedbd0;
      font-size: .9rem;
      margin-bottom: 8px;
    }

    .input-wrapper { position: relative; }

    .input-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-color);
      pointer-events: none;
    }

    .ishraq-input {
      width: 100%;
      min-height: 52px;
      padding: 10px 44px;
      border: 1px solid rgba(237,206,160,.15);
      border-radius: 13px;
      color: #fff;
      background: rgba(0,0,0,.23);
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .ishraq-input::placeholder { color: #858278; }

    .ishraq-input:focus {
      border-color: var(--gold-color);
      box-shadow: 0 0 0 3px rgba(197,160,89,.10);
    }

    .password-toggle {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: #aaa99f;
      cursor: pointer;
    }

    .password-toggle:hover { color: var(--gold-accent); }

    .login-button {
      width: 100%;
      min-height: 53px;
      margin-top: 24px;
      border: 0;
      border-radius: 13px;
      color: #211f19;
      background: linear-gradient(135deg, #EDCEA0, #b68b3f);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
      transition: transform .2s, filter .2s;
    }

    .login-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .login-button:disabled {
      opacity: .7;
      cursor: wait;
    }

    .login-error {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border: 1px solid rgba(220,100,100,.25);
      border-radius: 12px;
      background: rgba(150,50,50,.12);
      color: #f0b9b9;
      font-size: .87rem;
      line-height: 1.6;
    }

    .login-error.show { display: block; }

    .login-footer {
      margin-top: 23px;
      text-align: center;
      color: #8f8d83;
      font-size: .8rem;
      line-height: 1.9;
    }

    .login-footer strong {
      color: var(--gold-color);
      font-weight: 500;
    }

    @media (max-width: 480px) {
      .login-page { padding: 25px 15px; }
      .brand-symbol { width: 74px; height: 74px; }
      .brand-symbol img { width: 57px; height: 57px; }
      .brand-name { font-size: 2.9rem; }
      .login-card { padding: 26px 20px 23px; }
    }
  </style>
</head>

<body>
  <main class="login-page">
    <div class="login-wrapper">

      <header class="brand-area">
        <div class="brand-symbol">
          <img
            src="./5b862b4281f64fd884b11984846f0e97.png"
            alt="شعار الإشراق"
          >
        </div>

        <h2 class="brand-name">الإشراق</h2>
        <p class="brand-subtitle">نشرق بروحك ونسمو بقلبك</p>
        <div class="gold-divider"></div>
      </header>

      <section class="login-card">
        <div class="card-heading">
          <h1>أهلًا بك في الإشراق</h1>
          <p>سجّل دخولك وتابع رحلتك الإيمانية</p>
        </div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label">البريد الإلكتروني</label>
            <div class="input-wrapper">
              <i class="bi bi-envelope input-icon"></i>
              <input
                type="email"
                id="email"
                class="ishraq-input"
                placeholder="أدخل بريدك الإلكتروني"
                autocomplete="username"
                required
              >
            </div>
          </div>

          <div>
            <label for="password" class="form-label">كلمة المرور</label>
            <div class="input-wrapper">
              <i class="bi bi-lock input-icon"></i>
              <input
                type="password"
                id="password"
                class="ishraq-input"
                placeholder="أدخل كلمة المرور"
                autocomplete="current-password"
                required
              >
              <button
                type="button"
                id="togglePassword"
                class="password-toggle"
                aria-label="إظهار كلمة المرور"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div id="loginError" class="login-error" role="alert"></div>

          <button type="submit" id="loginButton" class="login-button">
            <i class="bi bi-box-arrow-in-left ms-1"></i>
            تسجيل الدخول
          </button>
        </form>
      </section>

      <footer class="login-footer">
        <div><strong>الإشراق</strong> — نشرق بروحك ونسمو بقلبك</div>
        <div>نسأل الله أن يجعل هذا العمل نورًا وأجرًا ممتدًا</div>
      </footer>

    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3RQ2jrXcJOUqmhUrGuBQ6R8kZ2sSLOr0",
      authDomain: "alishraq-fe305.firebaseapp.com",
      projectId: "alishraq-fe305",
      storageBucket: "alishraq-fe305.firebasestorage.app",
      messagingSenderId: "816905605188",
      appId: "1:816905605188:web:639252ce9ef899bd622c11",
      measurementId: "G-X6NV8MT549"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const button = document.getElementById("loginButton");
    const errorBox = document.getElementById("loginError");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
      const show = passwordInput.type === "password";
      passwordInput.type = show ? "text" : "password";
      togglePassword.innerHTML = show
        ? '<i class="bi bi-eye-slash"></i>'
        : '<i class="bi bi-eye"></i>';
      togglePassword.setAttribute(
        "aria-label",
        show ? "إخفاء كلمة المرور" : "إظهار كلمة المرور"
      );
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.classList.remove("show");

      const originalButton = button.innerHTML;
      button.disabled = true;
      button.innerHTML =
        '<span class="spinner-border spinner-border-sm ms-2"></span> جارٍ تسجيل الدخول...';

      try {
        await signInWithEmailAndPassword(
          auth,
          emailInput.value.trim(),
          passwordInput.value
        );

        window.location.replace("./index.html");
      } catch (error) {
        console.error("Login error:", error);

        const messages = {
          "auth/invalid-credential": "البريد الإلكتروني أو كلمة المرور غير صحيحة.",
          "auth/invalid-email": "يرجى إدخال بريد إلكتروني صحيح.",
          "auth/user-disabled": "هذا الحساب معطّل.",
          "auth/too-many-requests": "محاولات كثيرة. حاول مرة أخرى بعد قليل.",
          "auth/network-request-failed": "تعذّر الاتصال بالإنترنت. تحقق من اتصالك."
        };

        errorBox.textContent =
          messages[error.code] ||
          "تعذّر تسجيل الدخول. حاول مرة أخرى.";

        errorBox.classList.add("show");
        button.disabled = false;
        button.innerHTML = originalButton;
      }
    });
  </script>
</body>
</html>
