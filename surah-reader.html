<!doctype html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
  <head>
    <title>قراءة السورة - إشراق v1.0</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS RTL v5.3.3 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Amiri+Quran&family=Amiri:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Custom Style -->
    <link rel="stylesheet" href="./style.css" />
    <meta name="theme-color" content="#21211D" />
  </head>

  <body style="background-color: #21211d; color: #f8f9fa; font-family: 'Tajawal', sans-serif;">
    
    <!-- هيدر علوي مريح ومسافة آمنة لعدم التداخل -->
    <header>
      <nav
        class="navbar fixed-top shadow-sm px-3"
        style="background-color: #21211d !important; border-bottom: 0.2rem solid #edcea0; height: 65px;"
      >
        <div class="container-fluid d-flex justify-content-between align-items-center">
          <a href="./quran.html" class="btn btn-sm d-flex align-items-center gap-1" style="border: 1px solid #edcea0; color: #edcea0;">
            <i class="bi bi-arrow-right"></i> السور
          </a>
          <div
            id="surah-top-title"
            class="h6 my-auto fw-bold text-center text-truncate"
            style="color: #edcea0; max-width: 55%;"
          >
            جاري التحميل...
          </div>
          <a class="navbar-brand m-0" href="./index.html">
            <img src="./5b862b4281f64fd884b11984846f0e97.png" width="40" alt="إشراق" />
          </a>
        </div>
      </nav>
    </header>

    <!-- محتوى صفحة القراءة مع مسافة علوية كافية تماماً لتجنب أي تداخل -->
    <main style="margin-top: 85px; margin-bottom: 90px;">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-lg-10">
            
            <!-- شريط الأدوات المنسق والاحترافي -->
            <div class="card shadow-lg p-3 mb-4 rounded-4" style="background-color: #1b1b18 !important; border: 1px solid rgba(237, 206, 160, 0.4) !important;">
              <div class="d-flex flex-column gap-2">
                
                <!-- أزرار العرض ونوع الخط والتكبير والتصغير -->
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
                  <div class="d-flex align-items-center gap-2">
                    <button id="toggle-layout-btn" class="btn btn-sm rounded-pill px-3 fw-bold" style="border: 1px solid #edcea0; color: #edcea0; background: transparent;">
                      <i class="bi bi-book"></i> شكل المصحف
                    </button>

                    <button id="toggle-font-family-btn" class="btn btn-sm rounded-pill px-3 fw-bold" style="border: 1px solid #edcea0; color: #edcea0; background: transparent;">
                      <i class="bi bi-fonts"></i> الرسم العثماني
                    </button>
                  </div>

                  <div class="d-flex align-items-center gap-2">
                    <div class="btn-group rounded-pill overflow-hidden" role="group" style="border: 1px solid rgba(237, 206, 160, 0.4);">
                      <button id="font-decrease-btn" class="btn btn-sm px-2" style="color: #edcea0; background: transparent;"><i class="bi bi-dash-lg"></i></button>
                      <span id="font-size-indicator" class="btn btn-sm text-light disabled px-2 m-0" style="pointer-events: none; background: rgba(237,206,160,0.1); color: #edcea0 !important;">100%</span>
                      <button id="font-increase-btn" class="btn btn-sm px-2" style="color: #edcea0; background: transparent;"><i class="bi bi-plus-lg"></i></button>
                    </div>

                    <button id="focus-mode-btn" class="btn btn-sm rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 34px; height: 34px; border: 1px solid #edcea0; color: #edcea0; background: transparent;" title="ملء الشاشة">
                      <i class="bi bi-arrows-fullscreen"></i>
                    </button>
                  </div>
                </div>

                <!-- زر الاستماع المنفصل -->
                <div class="w-100 mt-1">
                  <button id="audio-play-btn" class="btn btn-sm rounded-pill px-4 py-2 w-100 fw-bold shadow-sm" style="background-color: #edcea0; color: #1b1b18;">
                    <i class="bi bi-play-fill me-1"></i> استماع لتلاوة السورة (الشيخ مشاري العفاسي)
                  </button>
                </div>

              </div>

              <!-- شريط تقدم الصوت -->
              <div id="audio-progress-wrap" class="mt-2 pt-2 d-none" style="border-top: 1px solid rgba(237, 206, 160, 0.2);">
                <div class="d-flex align-items-center justify-content-between">
                  <small id="audio-ayah-indicator" class="fw-bold" style="color: #edcea0;">الآية ١ من ١</small>
                  <button id="audio-stop-btn" class="btn btn-sm btn-outline-danger py-0 px-2"><i class="bi bi-stop-fill"></i> إيقاف</button>
                </div>
              </div>
              <audio id="surah-audio" preload="none"></audio>
            </div>

            <!-- صندوق عرض الآيات القرآنية -->
            <div id="ayahs-container" class="p-4 rounded-4 shadow-lg" style="background-color: #1b1b18 !important; border: 1px solid rgba(237, 206, 160, 0.3) !important;">
              <div class="text-center text-light py-5">
                <div class="spinner-border" role="status" style="color: #edcea0;">
                  <span class="visually-hidden">جاري التحميل...</span>
                </div>
                <p class="mt-2 text-opacity-75">جاري جلب آيات السورة...</p>
              </div>
            </div>

          </div>
        </div>
      </div>
    </main>

    <!-- شريط التنقل السفلي الثابت للهواتف -->
    <nav class="bottom-nav fixed-bottom d-md-none" style="background-color: #151512; border-top: 1px solid rgba(237, 206, 160, 0.2);">
      <div class="container d-flex justify-content-around align-items-center py-2">
        <a href="index.html" class="nav-item-bottom text-center text-decoration-none text-muted"><i class="bi bi-house-door fs-5 d-block"></i><span class="small">الرئيسية</span></a>
        <a href="tasbeeh.html" class="nav-item-bottom text-center text-decoration-none text-muted"><i class="bi bi-circle fs-5 d-block"></i><span class="small">السبحة</span></a>
        <a href="qibla.html" class="nav-item-bottom text-center text-decoration-none text-muted"><i class="bi bi-compass fs-5 d-block"></i><span class="small">القبلة</span></a>
        <a href="matwaf.html" class="nav-item-bottom text-center text-decoration-none text-muted"><i class="bi bi-person-walking fs-5 d-block"></i><span class="small">المطوف</span></a>
        <a href="settings.html" class="nav-item-bottom text-center text-decoration-none text-muted"><i class="bi bi-gear fs-5 d-block"></i><span class="small">الإعدادات</span></a>
      </div>
    </nav>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./surah-reader.js"></script>
  </body>
</html>
